<!-- Safari's own "Open in the app" bar. It needs the numeric App Store id,
     which only exists once the listing does — a bundle id will not do. Put
     it in APP_STORE_ID below and the bar appears; until then there is
     nothing to point it at. -->
<style>
  .route { max-width: 460px; margin: 0 auto; padding: 8px 24px 64px; text-align: center; }
  .shape {
    position: relative; background: #0E1319; border-radius: 22px;
    border: 2px solid var(--ink); overflow: hidden; aspect-ratio: 4 / 3;
  }
  .shape svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .shape .waiting {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #5D636C; font-size: 14px;
  }
  .route h1 { font-size: clamp(30px, 7vw, 42px); margin-top: 26px; }
  .stats {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 18px;
    margin-top: 14px; color: var(--ink-dim); font-size: 15.5px; font-weight: 500;
  }
  .stats span { white-space: nowrap; }
  .shared { color: var(--ink-dim); font-size: 16px; margin-top: 18px; }
  .route .btn { margin-top: 26px; }
  .fine { color: var(--ink-faint); font-size: 13.5px; line-height: 1.5; margin-top: 22px; }
</style>
</head>
<body>
<div class="terrain" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<nav class="top static">
  <div class="wrap">
    <div class="bar">
      <a class="wordmark" href="/" aria-label="Carve">
        <img class="appicon" src="/assets/icon-128.png?v=87d1534580" alt="" width="32" height="32">
        <img class="mark" src="/assets/wordmark-light.png?v=87d7b93bbc" alt="Carve" width="300" height="45">
      </a>
    </div>
  </div>
</nav>

<main class="route">
  <div class="shape" id="shape">
    <div class="waiting" id="waiting">Loading the route…</div>
  </div>
  <h1 id="name">A Carve route</h1>
  <div class="stats" id="stats" hidden></div>
  <p class="shared" id="shared">Someone shared a driving route with you.</p>
  <a class="btn btn-primary btn-lg" id="cta" href="#"><svg class="apple" aria-hidden="true"><use href="#apple"/></svg>Get Carve</a>
  <p class="fine">Carve plans drives on the roads worth taking and keeps them on your
     phone for when the signal goes. Open this link again once you have the app
     and the route is yours.</p>
</main>

<svg style="display:none" aria-hidden="true">
  <symbol id="apple" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
  </symbol>
</svg>

<script>
  // Where the one button goes. The TestFlight beta until the App Store
  // listing exists; then the listing's URL, and APP_STORE_ID below.
  const APP_STORE_URL = "https://testflight.apple.com/join/UUfMN7vj";
  // Safari's native "Open in the app" bar needs the numeric id from the
  // listing. Set it and the bar appears on its own.
  const APP_STORE_ID = "";

  // Publishable by design — the same key the app ships. Row-level security
  // is the boundary, and the only thing it can reach without a session is
  // redeeming a share token, which is exactly what this page is for.
  const SUPABASE_URL = "https://uvaabajzkzupecemzsug.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_06nXswMcxyIj4PwTOb_0pg_3_IB5r0U";

  document.getElementById("cta").href = APP_STORE_URL;
  if (APP_STORE_ID) {
    const meta = document.createElement("meta");
    meta.name = "apple-itunes-app";
    meta.content = "app-id=" + APP_STORE_ID;
    document.head.appendChild(meta);
  }

  // The token sits in a different place in each link form: the whole path
  // of a short link, the second segment of an /r/<token> one, or ?t= when
  // the 404 page forwarded it.
  const params = new URLSearchParams(location.search);
  const segments = location.pathname.split("/").filter(Boolean);
  const token = (segments[0] === "r" ? segments[1] : segments[0]) || params.get("t");
  const payload = params.get("d");

  function miles(metres) { return Math.round(metres / 1609.344).toLocaleString(); }
  function duration(seconds) {
    const h = Math.floor(seconds / 3600), m = Math.round((seconds % 3600) / 60);
    return h ? h + " hr " + m + " min" : m + " min";
  }

  /// The drive's own shape, drawn from its coordinates — no map tiles, so
  /// the page costs nothing to serve and works wherever it is opened.
  function drawShape(points, stops) {
    if (!points || points.length < 2) return false;
    const lats = points.map(p => p[0]), lons = points.map(p => p[1]);
    const midLat = (Math.min(...lats) + Math.max(...lats)) / 2;
    // Longitude degrees shrink toward the poles; without this the shape is
    // stretched sideways everywhere but the equator.
    const k = Math.cos(midLat * Math.PI / 180);
    const xs = lons.map(l => l * k), ys = lats.map(l => -l);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const pad = 0.12;
    const spanX = (maxX - minX) || 1e-6, spanY = (maxY - minY) || 1e-6;
    const span = Math.max(spanX, spanY) * (1 + pad * 2);
    const offX = (minX + maxX) / 2 - span / 2, offY = (minY + maxY) / 2 - span / 2;
    const at = (lat, lon) => [
      ((lon * k - offX) / span) * 100,
      ((-lat - offY) / span) * 100,
    ];
    const d = points.map((p, i) => {
      const [x, y] = at(p[0], p[1]);
      return (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
    }).join(" ");
    const marks = (stops || []).map(s => {
      const [x, y] = at(s[0], s[1]);
      return '<circle cx="' + x.toFixed(2) + '" cy="' + y.toFixed(2) + '" r="2.1" fill="#E4731C" stroke="#0E1319" stroke-width="0.9"/>';
    }).join("");
    const [sx, sy] = at(points[0][0], points[0][1]);
    const [ex, ey] = at(points[points.length - 1][0], points[points.length - 1][1]);
    document.getElementById("shape").innerHTML =
      '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">' +
      '<path d="' + d + '" fill="none" stroke="#2E92FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
      marks +
      '<circle cx="' + sx.toFixed(2) + '" cy="' + sy.toFixed(2) + '" r="2.6" fill="#2E9E52" stroke="#0E1319" stroke-width="0.9"/>' +
      '<circle cx="' + ex.toFixed(2) + '" cy="' + ey.toFixed(2) + '" r="2.6" fill="#EDF3F9" stroke="#0E1319" stroke-width="0.9"/>' +
      "</svg>";
    return true;
  }

  function show(route) {
    if (!route) return false;
    if (route.name) {
      document.getElementById("name").textContent = route.name;
      document.title = route.name + " — a Carve route";
    }
    const bits = [];
    if (route.distanceMeters) bits.push(miles(route.distanceMeters) + " miles");
    if (route.stops) bits.push(route.stops + (route.stops === 1 ? " stop" : " stops"));
    if (route.durationSeconds) bits.push(duration(route.durationSeconds));
    if (bits.length) {
      const stats = document.getElementById("stats");
      stats.innerHTML = bits.map(b => "<span>" + b + "</span>").join("");
      stats.hidden = false;
    }
    const drawn = drawShape(route.points, route.stopPoints);
    if (!drawn) document.getElementById("waiting").textContent = "";
    return true;
  }

  /// The embedded payload: no server, no network, works for old links.
  function fromPayload() {
    if (!payload) return null;
    try {
      const wire = JSON.parse(atob(payload.replace(/-/g, "+").replace(/_/g, "/")));
      const points = [[wire.s.a, wire.s.o]]
        .concat((wire.w || []).map(w => [w.a, w.o]))
        .concat([[wire.e.a, wire.e.o]]);
      return {
        name: wire.n,
        stops: (wire.w || []).filter(w => w.t === "stop").length,
        points: points,
        stopPoints: (wire.w || []).filter(w => w.t === "stop").map(w => [w.a, w.o]),
      };
    } catch (e) { return null; }
  }

  /// The route as it stands now, redeemed from the backend — the only
  /// source a short link has, and the current version either way.
  async function fromBackend() {
    if (!token) return null;
    try {
      const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/redeem_share_token", {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY,
          "content-type": "application/json",
        },
        body: JSON.stringify({ share_token: token }),
      });
      if (!response.ok) return null;
      const rows = await response.json();
      const row = rows && rows[0];
      if (!row) return null;
      const geometry = (row.payload && row.payload.pathGeometry) || [];
      const waypoints = (row.payload && row.payload.waypoints) || [];
      const points = geometry.length >= 2
        ? geometry.map(p => [p.latitude, p.longitude])
        : [[row.start_lat, row.start_lon]]
            .concat(waypoints.map(w => [w.location.latitude, w.location.longitude]))
            .concat([[row.end_lat, row.end_lon]]);
      return {
        name: row.name,
        distanceMeters: row.distance_meters,
        durationSeconds: row.duration_seconds,
        stops: row.stop_count,
        points: points,
        stopPoints: waypoints.filter(w => w.type === "stop")
          .map(w => [w.location.latitude, w.location.longitude]),
      };
    } catch (e) { return null; }
  }

  (async function () {
    // The backend has the current version; the payload is the fallback, and
    // is shown first when present so the page isn't blank while we ask.
    const embedded = fromPayload();
    if (embedded) show(embedded);
    const fresh = await fromBackend();
    if (fresh) {
      show(fresh);
    } else if (!embedded) {
      document.getElementById("waiting").textContent = "This route couldn’t be loaded.";
      document.getElementById("shared").textContent =
        "The link may have been removed, or you may be offline.";
    }
  })();
</script>
</body>
</html>
