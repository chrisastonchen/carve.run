<!-- The route itself arrives as JSON in #route-data, written into this page
     by the Worker (cloudflare/map-worker.js) from the shared route: name,
     numbers, photo, blurb, roads, stops, maker and roughly where it is. A
     link to someone who has never heard of Carve, so the page sells the
     drive first and the app second. Safari's own "Open in the app" bar
     comes from APP_STORE_ID below. -->
<style>
  nav.top .bar { border: none; background: transparent; padding-left: 0; }
  .route { max-width: 680px; margin: 0 auto; padding: 0 20px 120px; }
  .route h1, .route h2 { font-family: var(--sans); font-weight: 700; letter-spacing: -0.02em; }

  /* The top: the route's photo with its name over it, or, with no photo,
     its map with the name underneath. */
  .hero { position: relative; border-radius: 22px; overflow: hidden; background: #1D5B3A; }
  .hero .picture { display: block; width: 100%; aspect-ratio: 1200 / 630; object-fit: cover; }
  .hero.photo .picture { aspect-ratio: 16 / 10; }
  .hero.photo::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(10,12,16,0) 38%, rgba(10,12,16,.8) 100%);
  }
  .heading { display: flex; flex-direction: column; gap: 6px; padding: 18px 2px 0; }
  .hero.photo .heading { position: absolute; left: 20px; right: 20px; bottom: 18px; padding: 0; color: #fff; z-index: 1; }
  .place { font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .hero.photo .place { color: rgba(255,255,255,.9); }
  .route h1 { margin: 0; font-size: clamp(34px, 8vw, 48px); line-height: 1.02; }
  .byline { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--ink-dim); }
  .hero.photo .byline { color: #fff; }
  .byline img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
  .hero.photo .byline img { border: 1.5px solid #fff; }
  .hero:not(.photo) { background: none; border-radius: 0; overflow: visible; }
  .hero:not(.photo) .picture { border-radius: 22px; border: 1px solid var(--line); background: #E8EEF0; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 20px; }
  .stat {
    display: flex; flex-direction: column; gap: 4px; padding: 12px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
  }
  .stat .value { display: flex; align-items: center; gap: 7px; font-size: 21px; font-weight: 700; }
  .stat svg { width: 19px; height: 19px; flex: none; color: var(--route); }
  .stat .label { font-size: 12.5px; color: var(--ink-dim); }
  .blurb { font-size: 17px; line-height: 1.55; margin: 20px 0 0; }

  /* One big button for the phone in hand; under it every platform's icons,
     each pair a link to its store (the landing page's row). */
  .get { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 24px; }
  .cta {
    align-self: stretch;
    display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px;
    border-radius: 999px; background: var(--ink); color: #fff; text-decoration: none;
    font-size: 17.5px; font-weight: 600; box-shadow: 0 8px 22px rgba(21,24,28,.18);
  }
  .cta svg { width: 21px; height: 21px; }
  .platforms { display: flex; align-items: center; gap: 6px; color: var(--ink-dim); }
  .platforms a {
    display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 12px;
    color: inherit; text-decoration: none;
  }
  .platforms a:hover { color: var(--ink); background: rgba(21,24,28,.05); }
  .platforms svg { width: 22px; height: 22px; display: block; }
  .platforms .sep { width: 1px; height: 20px; background: currentColor; opacity: .4; }
  .open-hint { font-size: 13.5px; color: var(--ink-dim); text-align: center; margin: 2px 0 0; }
  body.desktop .cta { display: none; }

  .route h2 { font-size: 26px; margin: 40px 0 12px; }
  .map img { display: block; width: 100%; aspect-ratio: 1200 / 630; object-fit: cover; border-radius: 16px; border: 1px solid var(--line); }
  .roads { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; font-size: 14.5px; font-weight: 600; }
  .roads .road { padding: 6px 11px; border-radius: 9px; background: var(--sky); }
  .roads .arrow { color: var(--ink-faint); }
  .stops { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .stops li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; font-weight: 600; }
  .stops li + li { border-top: 1px solid #EEE8DA; }
  .stops .pin {
    flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--stop); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
  }
  .why { display: flex; flex-direction: column; gap: 16px; }
  .why .row { display: flex; gap: 14px; align-items: flex-start; }
  .why .mark { flex: none; width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
  .why .mark svg { width: 22px; height: 22px; }
  .why strong { display: block; font-size: 16.5px; }
  .why span { font-size: 15px; color: var(--ink-dim); line-height: 1.45; }
  .credits { font-size: 12.5px; color: var(--ink-faint); line-height: 1.5; margin-top: 40px; }
  .credits a { color: inherit; }
  .missing { text-align: center; padding: 48px 0; color: var(--ink-dim); }

  /* On a phone, the button follows once the one above has scrolled away. */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
    background: rgba(251,248,239,.96); border-top: 1px solid var(--line);
    transform: translateY(110%); transition: transform .25s ease;
  }
  .dock.shown { transform: none; }
  .dock .what { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dock .what b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .dock .what span { font-size: 13px; color: var(--ink-dim); }
  .dock a { min-height: 44px; padding: 0 20px; border-radius: 12px; background: var(--route); color: #fff; font-weight: 600; text-decoration: none; display: flex; align-items: center; }
  body.desktop .dock { display: none; }
  @media (prefers-reduced-motion: reduce) { .dock { transition: none; } }
  @media (max-width: 560px) {
    .route { padding: 0 0 120px; }
    .hero.photo { border-radius: 0; }
    .hero:not(.photo) .picture { border-radius: 0; border-left: 0; border-right: 0; }
    .route > :not(.hero), .hero:not(.photo) .heading { padding-left: 16px; padding-right: 16px; }
    .stats, .get { margin-left: 16px; margin-right: 16px; padding: 0 !important; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

<svg style="display:none" aria-hidden="true">

  <symbol id="android" viewBox="0 0 24 24">
    <path fill="currentColor" d="M18.4395 5.5586c-.675 1.1664-1.352 2.3318-2.0274 3.498-.0366-.0155-.0742-.0286-.1113-.043-1.8249-.6957-3.484-.8-4.42-.787-1.8551.0185-3.3544.4643-4.2597.8203-.084-.1494-1.7526-3.021-2.0215-3.4864a1.1451 1.1451 0 0 0-.1406-.1914c-.3312-.364-.9054-.4859-1.379-.203-.475.282-.7136.9361-.3886 1.5019 1.9466 3.3696-.0966-.2158 1.9473 3.3593.0172.031-.4946.2642-1.3926 1.0177C2.8987 12.176.452 14.772 0 18.9902h24c-.119-1.1108-.3686-2.099-.7461-3.0683-.7438-1.9118-1.8435-3.2928-2.7402-4.1836a12.1048 12.1048 0 0 0-2.1309-1.6875c.6594-1.122 1.312-2.2559 1.9649-3.3848.2077-.3615.1886-.7956-.0079-1.1191a1.1001 1.1001 0 0 0-.8515-.5332c-.5225-.0536-.9392.3128-1.0488.5449zm-.0391 8.461c.3944.5926.324 1.3306-.1563 1.6503-.4799.3197-1.188.0985-1.582-.4941-.3944-.5927-.324-1.3307.1563-1.6504.4727-.315 1.1812-.1086 1.582.4941zM7.207 13.5273c.4803.3197.5506 1.0577.1563 1.6504-.394.5926-1.1038.8138-1.584.4941-.48-.3197-.5503-1.0577-.1563-1.6504.4008-.6021 1.1087-.8106 1.584-.4941z"/>

  </symbol>
  <!-- The stats' marks; the preview card draws the same (supabase/functions/og-card/card.ts). -->
  <symbol id="stat-distance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c5 0 4-7 7-7s2-7 7-7"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></symbol>

<script>
  // The stores. Android goes to the beta's Google Group until the app is
  // public on Google Play (as on the landing page); then PLAY_URL.
  const APP_STORE_URL = "https://apps.apple.com/app/carve-route-planner/id6808087716";
  const APP_STORE_ID = "6808087716";
  const ANDROID_URL = "https://groups.google.com/g/carve-beta";
  // const PLAY_URL = "https://play.google.com/store/apps/details?id=run.carve.app";

  // Publishable by design — the same key the app ships. Only used when the
  // Worker didn't hand the page its route (an old ?d= link, or the Worker
  // down): row-level security is the boundary, and the only thing it can
  // reach without a session is redeeming a share token.
  const SUPABASE_URL = "https://uvaabajzkzupecemzsug.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_06nXswMcxyIj4PwTOb_0pg_3_IB5r0U";

  const ua = navigator.userAgent || "";
  const isAndroid = /android/i.test(ua);
  const isApple = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  if (!isAndroid && !isApple) document.body.classList.add("desktop");

  // The token sits in a different place in each link form: the whole path
  // of a short link, the second segment of an /r/<token> one, or ?t= when
  // the 404 page forwarded it. ?d= is the old self-contained link.
  const params = new URLSearchParams(location.search);
  const segments = location.pathname.split("/").filter(Boolean);
  const token = (segments[0] === "r" ? segments[1] : segments[0]) || params.get("t");
  const payload = params.get("d");

  if (APP_STORE_ID && isApple) {
    const meta = document.createElement("meta");
    meta.name = "apple-itunes-app";
    meta.content = "app-id=" + APP_STORE_ID;
    document.head.appendChild(meta);
  }

  // MARK: - Building the page

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key === "class") node.className = value;
      else node.setAttribute(key, value);
    }
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child.nodeType ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  function icon(id) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("aria-hidden", "true");
    const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#" + id);
    svg.append(use);
    return svg;
  }

  const LABELS = { distance: "distance", time: "drive time", climb: "climbing", stops: "on the way" };

  function render(info) {
    const main = document.getElementById("route");
    main.innerHTML = "";
    const name = info.name || "A Carve route";
    document.title = name + " — a drive on Carve";

    // The top.
    const hasPhoto = !!(info.photo && info.photo.url);
    const picture = el("img", {
      class: "picture",
      src: hasPhoto ? info.photo.url : (token ? "/map/" + encodeURIComponent(token) : null),
      alt: hasPhoto ? "" : name + " on a map",
      fetchpriority: "high",
    });
    picture.addEventListener("error", () => picture.remove());
    const heading = el("div", { class: "heading" },
      info.place ? el("span", { class: "place" }, info.place.long || info.place.short) : null,
      el("h1", {}, name),
      info.author ? el("div", { class: "byline" }, "A drive by ", el("strong", {}, "@" + info.author)) : null,
    );
    main.append(el("div", { class: "hero" + (hasPhoto ? " photo" : "") }, picture.getAttribute("src") ? picture : null, heading));

    // The numbers.
    const stats = (info.stats || []).filter(s => s && s.text);
    if (stats.length) {
      main.append(el("div", { class: "stats" }, stats.map(s =>
        el("div", { class: "stat" },
          el("span", { class: "value" }, LABELS[s.kind] ? icon("stat-" + s.kind) : null, s.text),
          el("span", { class: "label" }, LABELS[s.kind] || ""),
        ),
      )));
    }
    if (info.blurb) main.append(el("p", { class: "blurb" }, info.blurb));

    // The way in.
    const cta = el("a", { class: "cta", id: "get", href: isAndroid ? ANDROID_URL : APP_STORE_URL },
      icon(isAndroid ? "android" : "apple"),
      isAndroid ? "Drive it on Android" : "Drive it on iPhone",
    );
    cta.addEventListener("click", openInApp);
    main.append(el("div", { class: "get" },
      cta,
      el("div", { class: "platforms" },
        el("a", { href: APP_STORE_URL, title: "iPhone and CarPlay", "aria-label": "Carve for iPhone and CarPlay on the App Store" },
          icon("apple"), icon("carplay")),
        el("span", { class: "sep", "aria-hidden": "true" }),
        el("a", { href: ANDROID_URL, title: "Android and Android Auto", "aria-label": "Carve for Android and Android Auto" },
          icon("android"), icon("androidauto")),
      ),
      document.body.classList.contains("desktop")
        ? el("p", { class: "open-hint" }, "Open this link on your phone to drive it.")
        : el("p", { class: "open-hint" }, "Already have Carve? The button opens the route in the app."),
    ));

    // The route: its map (when the top is the photo) and the roads it takes.
    const roads = info.roads || [];
    if ((hasPhoto && token) || roads.length) {
      const section = el("section", { class: "map" }, el("h2", {}, "The route"));
      if (hasPhoto && token) {
        const map = el("img", { src: "/map/" + encodeURIComponent(token), alt: name + " on a map", loading: "lazy" });
        map.addEventListener("error", () => map.remove());
        section.append(map);
      }
      if (roads.length) {
        section.append(el("div", { class: "roads", "aria-label": "Roads, in order" },
          roads.map((road, i) => [i ? el("span", { class: "arrow", "aria-hidden": "true" }, "→") : null, el("span", { class: "road" }, road)])));
      }
      main.append(section);
    }

    // The stops.
    const stops = info.stops || [];
    if (stops.length) {
      main.append(el("section", {},
        el("h2", {}, "Stops along the way"),
        el("ol", { class: "stops" }, stops.map((stop, i) =>
          el("li", {}, el("span", { class: "pin", "aria-hidden": "true" }, String(i + 1)), stop.name))),
      ));
    }

    // Why Carve.
    main.append(el("section", {},
      el("h2", {}, "Why drive it in Carve"),
      el("div", { class: "why" },
        why("why-road", "#D4E7FF", "#1A5FB4", "These exact roads",
          "Turn by turn, without rerouting you onto the freeway. Miss a turn and Carve leads you back to this road."),
        why("why-offline", "#DCF1E2", "#2E7D46", "No signal, no problem",
          "Download the route and its map before you go. Ridges and canyons drop service; Carve keeps going."),
        why("why-group", "#FFE4D3", "#B4561A", "Bring the group",
          "Everyone driving the route sees each other on the map and the car's screen, by name."),
        el("span", {}, "On iPhone and Android, with CarPlay and Android Auto."),
      ),
    ));

    // Where the photo came from, and the small print.
    const credit = hasPhoto && info.photo.credit
      ? el("span", {}, "Photo: ", info.photo.creditURL
          ? el("a", { href: info.photo.creditURL, rel: "noopener" }, info.photo.credit)
          : info.photo.credit, ". ")
      : null;
    main.append(el("p", { class: "credits" }, credit,
      "Distance, time and climbing are from Carve's route. Roads close for weather and repairs; check conditions before you go."));

    // The bar that follows on a phone.
    document.getElementById("bar-name").textContent = name;
    document.getElementById("bar-stats").textContent = stats.slice(0, 2).map(s => s.text).join(" · ");
    const barCta = document.getElementById("bar-cta");
    barCta.href = cta.href;
    barCta.addEventListener("click", openInApp);
    if ("IntersectionObserver" in window) {
      const dock = document.getElementById("dock");
      new IntersectionObserver(([entry]) => {
        const show = !entry.isIntersecting && entry.boundingClientRect.top < 0;
        dock.classList.toggle("shown", show);
        dock.setAttribute("aria-hidden", show ? "false" : "true");
        barCta.tabIndex = show ? 0 : -1;
      }).observe(cta);
    }
  }

  function why(symbol, fill, ink, title, text) {
    const mark = el("span", { class: "mark", style: "background:" + fill + ";color:" + ink }, icon(symbol));
    return el("div", { class: "row" }, mark, el("div", {}, el("strong", {}, title), el("span", {}, text)));
  }

  // MARK: - Opening the app

  // Try the app, fall back to the store. There is no way to ask a phone
  // whether an app is installed: on iPhone the scheme is attempted and the
  // store follows unless the page goes away, which is what happens when the
  // app takes over; on Android an intent link names the app and its own
  // fallback.
  function openInApp(event) {
    if (!token && !payload) return;   // nothing to open: let the store link work
    if (document.body.classList.contains("desktop")) return;
    event.preventDefault();
    const query = (payload ? "d=" + encodeURIComponent(payload) : "")
      + (payload && token ? "&" : "")
      + (token ? "t=" + encodeURIComponent(token) : "");
    if (isAndroid) {
      location.href = "intent://route?" + query + "#Intent;scheme=carve;package=run.carve.app;"
        + "S.browser_fallback_url=" + encodeURIComponent(ANDROID_URL) + ";end";
      return;
    }
    let left = false;
    const leaving = () => { left = true; };
    window.addEventListener("pagehide", leaving, { once: true });
    document.addEventListener("visibilitychange", () => { if (document.hidden) leaving(); }, { once: true });
    setTimeout(() => { if (!left) location.href = APP_STORE_URL; }, 1500);
    location.href = "carve://route?" + query;
  }

  // MARK: - The route

  function fromPage() {
    const node = document.getElementById("route-data");
    if (!node) return null;
    try { return JSON.parse(node.textContent); } catch (e) { return null; }
  }

  function miles(meters) { return Math.round(meters / 1609.344).toLocaleString("en-US"); }
  function duration(seconds) {
    const total = Math.round(seconds / 60), h = Math.floor(total / 60), m = total % 60;
    return h ? (m ? h + " hr " + m + " min" : h + " hr") : m + " min";
  }

  /// The old self-contained link: just a name and how many stops.
  function fromPayload() {
    if (!payload) return null;
    try {
      const wire = JSON.parse(atob(payload.replace(/-/g, "+").replace(/_/g, "/")));
      const stops = (wire.w || []).filter(w => w.t === "stop").length;
      return { name: wire.n, stats: stops ? [{ kind: "stops", text: stops + (stops === 1 ? " stop" : " stops") }] : [] };
    } catch (e) { return null; }
  }

  /// Straight from the backend, when the Worker didn't write the route in.
  async function fromBackend() {
    if (!token) return null;
    try {
      const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/redeem_share_token", {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "content-type": "application/json" },
        body: JSON.stringify({ share_token: token }),
      });
      if (!response.ok) return null;
      const row = (await response.json())[0];
      if (!row) return null;
      const p = row.payload || {};
      const stats = [];
      if (row.distance_meters) stats.push({ kind: "distance", text: miles(row.distance_meters) + " mi" });
      if (row.duration_seconds) stats.push({ kind: "time", text: duration(row.duration_seconds) });
      if (row.stop_count) stats.push({ kind: "stops", text: row.stop_count + (row.stop_count === 1 ? " stop" : " stops") });
      return {
        name: row.name, stats, blurb: p.blurb || null,
        photo: p.photo && /^https:\/\//.test(p.photo.url || "") ? p.photo : null,
        stops: (p.waypoints || []).filter(w => w.type === "stop")
          .sort((a, b) => (a.order || 0) - (b.order || 0))
          .map((w, i) => ({ name: (w.label || "").trim() || "Stop " + (i + 1) })),
      };
    } catch (e) { return null; }
  }

  (async function () {
    const info = fromPage() || await fromBackend() || fromPayload();
    if (info) {
      render(info);
    } else {
      document.getElementById("missing").textContent =
        "This route couldn’t be loaded. The link may have been removed, or you may be offline.";
    }
  })();
</script>
</body>
</html>
